[package]
name = "portal-workstation-manager"
version = "0.1.0"
description = "Portal workstation source-data manager"
authors = ["Charlotte-Mecklenburg Storm Water Services"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "portal_workstation_manager"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }

[patch.crates-io]
# Reuse Portal's verified WebView2 binding source. The corporate proxy resets
# the generated crate download from static.crates.io.
webview2-com-sys = { git = "https://github.com/wravery/webview2-rs.git", rev = "b74dc5e2b394044bea5191052868ce7a106c202c" }
