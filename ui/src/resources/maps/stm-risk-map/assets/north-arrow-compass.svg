<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Monochrome compass rose north arrow</title>
  <desc id="description">A clean black and white compass rose designed for printed map title blocks.</desc>
  <defs>
    <g id="cardinalPoint">
      <path d="M256 250 L256 91 L220 225 Z" fill="#111" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
      <path d="M256 250 L256 91 L292 225 Z" fill="#fff" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <g id="intercardinalPoint">
      <path d="M256 246 L256 143 L233 227 Z" fill="#111" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <path d="M256 246 L256 143 L279 227 Z" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </defs>

  <g aria-hidden="true">
    <use href="#intercardinalPoint" transform="rotate(45 256 256)"/>
    <use href="#intercardinalPoint" transform="rotate(135 256 256)"/>
    <use href="#intercardinalPoint" transform="rotate(225 256 256)"/>
    <use href="#intercardinalPoint" transform="rotate(315 256 256)"/>
    <use href="#cardinalPoint"/>
    <use href="#cardinalPoint" transform="rotate(90 256 256)"/>
    <use href="#cardinalPoint" transform="rotate(180 256 256)"/>
    <use href="#cardinalPoint" transform="rotate(270 256 256)"/>
  </g>

  <circle cx="256" cy="256" r="42" fill="#fff" stroke="#111" stroke-width="7"/>
  <circle cx="256" cy="256" r="23" fill="#111"/>
  <circle cx="256" cy="256" r="8" fill="#fff"/>
  <text x="256" y="80" fill="#111" stroke="#fff" stroke-width="8" paint-order="stroke fill" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" text-anchor="middle">N</text>
</svg>
